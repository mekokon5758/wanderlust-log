<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Wanderlust Log{% endblock %}</title>

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        body {
            margin: 20px;
            font-family: Arial, sans-serif;
        }

        .title-link {
            text-decoration: none;
            color: black;
        }

        .title-link:hover {
            color: #555;
        }

        .profile-link {
            position: absolute;
            top: 20px;
            right: 20px;
            color: black;
            text-decoration: none;
        }

        .profile-link i {
            font-size: 3rem;
        }

        .profile-link:hover {
            color: #555;
        }
    </style>
</head>

<body>

    <!-- Profile Icon -->
    <a href="{% url 'profile' %}" class="profile-link">
        <i class="bi bi-person-circle"></i>
    </a>

    <!-- Clickable Title -->
    <h1>
        <a href="{% url 'overview' %}" class="title-link">
            Wanderlust Log
        </a>
    </h1>

    {% block content %}
    {% endblock %}

</body>
</html>
